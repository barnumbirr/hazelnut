[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hazelnut"
version = "1.0.0"
description = "A pythonic library to parse /proc/meminfo"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Martin Simon", email = "me@martinsimon.me" }]
keywords = ["memory", "RAM", "system information", "meminfo", "/proc"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/barnumbirr/hazelnut"
Repository = "https://github.com/barnumbirr/hazelnut"
Issues = "https://github.com/barnumbirr/hazelnut/issues"
Changelog = "https://github.com/barnumbirr/hazelnut/blob/master/CHANGELOG.md"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
